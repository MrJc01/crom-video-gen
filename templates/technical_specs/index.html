<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/templates/common/base.css">
    <style>
        .layout-container {
            display: flex;
            width: 1920px;
            height: 1080px;
        }
        .sidebar {
            width: 500px;
            height: 1080px;
            background-color: rgba(0, 0, 0, 0.65);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 80px 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            z-index: 10;
        }
        .sidebar h2 {
            font-size: 36px;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .specs-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .specs-list li {
            font-size: 24px;
            line-height: 1.8;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .specs-list li::before {
            content: "•";
            margin-right: 15px;
            font-size: 30px;
        }
        .main-content {
            width: 1420px;
            height: 1080px;
            position: relative;
        }
        .main-media {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div class="layout-container">
            <div class="sidebar">
                <h2 id="specs-title">Especificacoes</h2>
                <ul class="specs-list" id="specs-ul">
                    <!-- Dynamic bullet items will be placed here -->
                </ul>
            </div>
            <div class="main-content" id="media-container">
                <!-- Media dynamically placed here -->
            </div>
        </div>
        <div class="subtitles-container" style="left: 500px;">
            <div id="subtitles" class="subtitles-text"></div>
        </div>
    </div>

    <script>
        let mediaElement = null;
        let isVideo = false;

        window.setupTemplate = function(cenaJson) {
            const cena = JSON.parse(cenaJson);
            
            // Set subtitles
            document.getElementById('subtitles').innerText = cena.narracao.texto;

            // Get parameters
            const params = cena.template.parametros || {};
            const highlightColor = params.highlight_color !== undefined ? params.highlight_color : "#ffaa00";
            
            // Setup title & list colors
            const titleElement = document.getElementById('specs-title');
            titleElement.style.color = highlightColor;

            // Setup specs items
            const specsUl = document.getElementById('specs-ul');
            specsUl.innerHTML = ''; // clear
            
            let specItems = params.specs;
            if (!specItems || !Array.isArray(specItems)) {
                specItems = [
                    "Processamento Distribuido",
                    "Baixa Latencia (Crom Net)",
                    "Criptografia de Hardware"
                ];
            }

            specItems.forEach(item => {
                const li = document.createElement('li');
                li.innerText = item;
                li.style.color = highlightColor;
                specsUl.appendChild(li);
            });

            // Set media
            const container = document.getElementById('media-container');
            container.innerHTML = '';

            if (cena.ativos && cena.ativos.media0) {
                const media0 = cena.ativos.media0;
                if (media0.tipo === 'video') {
                    mediaElement = document.createElement('video');
                    mediaElement.src = media0.caminho;
                    mediaElement.muted = true;
                    mediaElement.className = 'main-media';
                    container.appendChild(mediaElement);
                    isVideo = true;
                } else {
                    mediaElement = document.createElement('img');
                    mediaElement.src = media0.caminho;
                    mediaElement.className = 'main-media';
                    container.appendChild(mediaElement);
                    isVideo = false;
                }
            }
        };

        window.seekTo = function(timeInSeconds, totalDuration) {
            if (isVideo && mediaElement) {
                mediaElement.currentTime = timeInSeconds;
            }
        };
    </script>
</body>
</html>

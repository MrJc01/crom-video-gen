<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/templates/common/base.css">
    <style>
        .cinematic-media {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
            /* Default color grading equivalent to eq/hue filters */
            filter: contrast(1.1) brightness(1.01) saturate(1.2) hue-rotate(15deg);
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div class="media-container" id="container">
            <!-- Media will be dynamically injected here -->
        </div>
        <div class="subtitles-container">
            <div id="subtitles" class="subtitles-text"></div>
        </div>
    </div>

    <script>
        let mediaElement = null;
        let isVideo = false;

        window.setupTemplate = function(cenaJson) {
            const cena = JSON.parse(cenaJson);
            
            // Set subtitles
            document.getElementById('subtitles').innerText = cena.narracao.texto;
            
            // Set dynamic media
            const container = document.getElementById('container');
            container.innerHTML = ''; // clear

            const params = cena.template.parametros || {};
            const blurAmount = params.blur_amount !== undefined ? params.blur_amount : 0;
            const blurStyle = blurAmount > 0 ? `blur(${blurAmount}px)` : '';

            if (cena.ativos && cena.ativos.media0) {
                const media0 = cena.ativos.media0;
                if (media0.tipo === 'video') {
                    mediaElement = document.createElement('video');
                    mediaElement.src = media0.caminho;
                    mediaElement.muted = true; // headless chrome requires video to be muted to play/seek
                    mediaElement.className = 'cinematic-media';
                    mediaElement.style.filter = `contrast(1.1) brightness(1.01) saturate(1.2) hue-rotate(15deg) ${blurStyle}`.trim();
                    container.appendChild(mediaElement);
                    isVideo = true;
                } else {
                    mediaElement = document.createElement('img');
                    mediaElement.src = media0.caminho;
                    mediaElement.className = 'cinematic-media';
                    mediaElement.style.filter = `contrast(1.1) brightness(1.01) saturate(1.2) hue-rotate(15deg) ${blurStyle}`.trim();
                    container.appendChild(mediaElement);
                    isVideo = false;
                }
            }
        };

        window.seekTo = function(timeInSeconds, totalDuration) {
            if (isVideo && mediaElement) {
                mediaElement.currentTime = timeInSeconds;
            }
        };
    </script>
</body>
</html>

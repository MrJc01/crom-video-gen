<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/templates/common/base.css">
    <style>
        .cinematic-media {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
            transform-origin: center center;
            transition: filter 0.1s linear;
        }
        .letterbox {
            position: absolute;
            left: 0;
            width: 1920px;
            background-color: black;
            z-index: 10;
        }
        #letterbox-top {
            top: 0;
            height: 0px; /* Animate to 80px */
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        #letterbox-bottom {
            bottom: 0;
            height: 0px; /* Animate to 80px */
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .vignette-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 4;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.75) 100%);
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div class="media-container" id="container">
            <!-- Media will be dynamically injected here -->
        </div>
        <div class="vignette-overlay"></div>
        <div id="letterbox-top" class="letterbox"></div>
        <div id="letterbox-bottom" class="letterbox"></div>
        <div class="subtitles-container">
            <div id="subtitles" class="subtitles-text"></div>
        </div>
    </div>

    <script>
        let mediaElement = null;
        let isVideo = false;
        let baseFilter = "contrast(1.1) brightness(1.01) saturate(1.2) hue-rotate(15deg)";
        let blurAmount = 0;

        const gradingPresets = {
            "cool_cyan": "contrast(1.15) brightness(0.98) saturate(1.1) hue-rotate(180deg) sepia(0.08)",
            "warm_gold": "contrast(1.08) brightness(1.02) saturate(1.25) sepia(0.2) hue-rotate(345deg)",
            "vintage_noir": "contrast(1.3) brightness(0.92) saturate(0)",
            "cyberpunk_neon": "contrast(1.35) brightness(1.02) saturate(1.8) hue-rotate(300deg)",
            "teal_orange": "contrast(1.15) brightness(1.0) saturate(1.3) hue-rotate(15deg) sepia(0.05)",
            "default": "contrast(1.1) brightness(1.01) saturate(1.2) hue-rotate(15deg)"
        };

        window.setupTemplate = function(cenaJson) {
            const cena = JSON.parse(cenaJson);
            
            // Set subtitles
            document.getElementById('subtitles').innerText = cena.narracao.texto;
            
            // Set dynamic media
            const container = document.getElementById('container');
            container.innerHTML = ''; // clear

            const params = cena.template.parametros || {};
            blurAmount = params.blur_amount !== undefined ? params.blur_amount : 0;
            const colorGradingVal = params.color_grading || "default";
            baseFilter = gradingPresets[colorGradingVal] || gradingPresets["default"];

            const blurStyle = blurAmount > 0 ? `blur(${blurAmount}px)` : '';
            const combinedFilter = `${baseFilter} ${blurStyle}`.trim();

            if (cena.ativos && cena.ativos.media0) {
                const media0 = cena.ativos.media0;
                if (media0.tipo === 'video') {
                    mediaElement = document.createElement('video');
                    mediaElement.src = media0.caminho;
                    mediaElement.muted = true; // headless chrome requires video to be muted
                    mediaElement.className = 'cinematic-media';
                    mediaElement.style.filter = combinedFilter;
                    container.appendChild(mediaElement);
                    isVideo = true;
                } else {
                    mediaElement = document.createElement('img');
                    mediaElement.src = media0.caminho;
                    mediaElement.className = 'cinematic-media';
                    mediaElement.style.filter = combinedFilter;
                    container.appendChild(mediaElement);
                    isVideo = false;
                }
            }
        };

        window.seekTo = function(timeInSeconds, totalDuration) {
            const durationSec = totalDuration || 5.0;
            const progress = Math.min(timeInSeconds / durationSec, 1.0);

            if (isVideo && mediaElement) {
                mediaElement.currentTime = timeInSeconds;
            }

            // Animate Letterbox Top/Bottom sliding in from 0px to 80px in first 20% of scene
            const letterboxHeight = Math.min(progress / 0.2, 1.0) * 80;
            document.getElementById('letterbox-top').style.height = `${letterboxHeight}px`;
            document.getElementById('letterbox-bottom').style.height = `${letterboxHeight}px`;

            // Ken Burns effect for static images: scale and subtle pan
            if (!isVideo && mediaElement) {
                const currentScale = 1.0 + 0.12 * progress;
                const currentTx = 15 * progress;
                const currentTy = 10 * progress;
                mediaElement.style.transform = `scale(${currentScale}) translate(${currentTx}px, ${currentTy}px)`;
            }
        };
    </script>
</body>
</html>

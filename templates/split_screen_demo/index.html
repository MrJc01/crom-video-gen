<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/templates/common/base.css">
    <style>
        .split-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #000;
        }
        .split-pane {
            position: absolute;
            top: 0;
            height: 1080px;
            overflow: hidden;
        }
        .left-pane {
            left: 0;
            width: 50%; /* Animated via JS */
            z-index: 2;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }
        .right-pane {
            left: 0;
            width: 1920px;
            z-index: 1;
        }
        .split-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            object-fit: contain;
            background: black;
        }
        .right-pane .split-media {
            filter: contrast(1.25) saturate(1.4) brightness(0.98);
        }
        
        /* Vertical divider line */
        .divider {
            position: absolute;
            top: 0;
            left: 50%; /* Animated via JS */
            width: 4px;
            height: 1080px;
            background: linear-gradient(180deg, #ffaa00, #ff5500);
            z-index: 10;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.7);
            transform: translateX(-2px); /* Center align */
        }
        .divider-glow {
            position: absolute;
            top: 0;
            left: -4px;
            width: 12px;
            height: 1080px;
            background: inherit;
            filter: blur(8px);
            opacity: 0.8;
            pointer-events: none;
        }
        .divider-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 54px;
            height: 54px;
            background: rgba(15, 15, 25, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid #ffaa00;
            border-radius: 50%;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 170, 0, 0.3);
            letter-spacing: 1px;
        }
        
        /* Floating labels */
        .pane-label {
            position: absolute;
            top: 50px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 15;
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }
        .left-label {
            left: 50px;
            border-left: 3px solid #ffaa00;
        }
        .right-label {
            right: 50px;
            border-right: 3px solid #ffaa00;
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div class="split-container">
            <div class="split-pane left-pane" id="left-pane">
                <!-- Left media here -->
            </div>
            <div class="divider" id="divider">
                <div class="divider-glow"></div>
                <div class="divider-badge">VS</div>
            </div>
            <div class="split-pane right-pane" id="right-pane">
                <!-- Right media here -->
            </div>
        </div>
        
        <div id="label-left" class="pane-label left-label" style="display: none;"></div>
        <div id="label-right" class="pane-label right-label" style="display: none;"></div>
        
        <div class="subtitles-container">
            <div id="subtitles" class="subtitles-text"></div>
        </div>
    </div>

    <script>
        let leftMedia = null;
        let rightMedia = null;
        let leftIsVideo = false;
        let rightIsVideo = false;
        let dividerTarget = 0.5;

        window.setupTemplate = function(cenaJson) {
            const cena = JSON.parse(cenaJson);
            
            // Set subtitles
            document.getElementById('subtitles').innerText = cena.narracao.texto;
            
            const leftPane = document.getElementById('left-pane');
            const rightPane = document.getElementById('right-pane');
            leftPane.innerHTML = '';
            rightPane.innerHTML = '';

            const params = cena.template.parametros || {};
            dividerTarget = params.divider_pos !== undefined ? params.divider_pos : 0.5;

            if (cena.ativos && cena.ativos.media0) {
                const media0 = cena.ativos.media0;
                const media1 = cena.ativos.media1 || media0; // Fallback to media0 if media1 is not provided

                // Setup left pane
                if (media0.tipo === 'video') {
                    leftMedia = document.createElement('video');
                    leftMedia.src = media0.caminho;
                    leftMedia.muted = true;
                    leftMedia.className = 'split-media';
                    leftPane.appendChild(leftMedia);
                    leftIsVideo = true;
                } else {
                    leftMedia = document.createElement('img');
                    leftMedia.src = media0.caminho;
                    leftMedia.className = 'split-media';
                    leftPane.appendChild(leftMedia);
                    leftIsVideo = false;
                }

                // Setup right pane
                if (media1.tipo === 'video') {
                    rightMedia = document.createElement('video');
                    rightMedia.src = media1.caminho;
                    rightMedia.muted = true;
                    rightMedia.className = 'split-media';
                    rightPane.appendChild(rightMedia);
                    rightIsVideo = true;
                } else {
                    rightMedia = document.createElement('img');
                    rightMedia.src = media1.caminho;
                    rightMedia.className = 'split-media';
                    rightPane.appendChild(rightMedia);
                    rightIsVideo = false;
                }

                // Setup labels if text0/text1 are provided
                const labelLeft = document.getElementById('label-left');
                if (params.text0) {
                    labelLeft.innerText = params.text0;
                    labelLeft.style.display = 'block';
                } else {
                    labelLeft.style.display = 'none';
                }
                
                const labelRight = document.getElementById('label-right');
                if (params.text1) {
                    labelRight.innerText = params.text1;
                    labelRight.style.display = 'block';
                } else {
                    labelRight.style.display = 'none';
                }
            }
        };

        window.seekTo = function(timeInSeconds, totalDuration) {
            if (leftIsVideo && leftMedia) {
                leftMedia.currentTime = timeInSeconds;
            }
            if (rightIsVideo && rightMedia) {
                rightMedia.currentTime = timeInSeconds;
            }

            const durationSec = totalDuration || 5.0;
            const progress = Math.min(timeInSeconds / durationSec, 1.0);

            // Sweep reveal transition: starts at 100% and slides to target in first 40% of duration
            let currentPos = 1.0;
            if (progress < 0.40) {
                const sweepProg = progress / 0.40;
                // Cubic easeInOut curve
                const ease = sweepProg < 0.5 ? 4 * sweepProg * sweepProg * sweepProg : 1 - Math.pow(-2 * sweepProg + 2, 3) / 2;
                currentPos = 1.0 - (1.0 - dividerTarget) * ease;
            } else {
                currentPos = dividerTarget;
            }

            // Apply style positions
            document.getElementById('left-pane').style.width = `${currentPos * 100}%`;
            document.getElementById('divider').style.left = `${currentPos * 100}%`;
        };
    </script>
</body>
</html>

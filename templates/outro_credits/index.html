<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="/templates/common/base.css">
    <style>
        .outro-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0a14 0%, #020205 100%);
        }
        
        /* Outro Glassmorphic Card */
        .outro-card {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: linear-gradient(135deg, rgba(20, 20, 35, 0.75) 0%, rgba(10, 10, 15, 0.45) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            opacity: 0;
            width: 500px;
        }
        .cta-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffaa00;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.2);
        }
        .qr-box-container {
            width: 220px;
            height: 220px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 25px;
        }
        .qr-svg {
            width: 100%;
            height: 100%;
        }
        .cta-subtitle {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        
        /* Social handles block */
        .social-handles {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            display: flex;
            gap: 30px;
            z-index: 10;
            opacity: 0;
        }
        .social-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-family: monospace;
        }
        .social-icon {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div class="outro-container">
            <div class="media-container" id="container">
                <!-- Media will be dynamically injected here -->
            </div>
            
            <div class="outro-card" id="outro-card">
                <div class="cta-title" id="cta-title">Acesse o Sistema</div>
                <div class="qr-box-container">
                     <!-- Procedural vector SVG QR Code representation -->
                     <svg width="220" height="220" viewBox="0 0 100 100" class="qr-svg">
                         <!-- Outer border alignment square top-left -->
                         <rect x="5" y="5" width="25" height="25" stroke="#ffaa00" stroke-width="3" fill="none" rx="2"></rect>
                         <rect x="10" y="10" width="15" height="15" fill="#ffaa00" rx="1"></rect>
                         <!-- Outer border alignment square top-right -->
                         <rect x="70" y="5" width="25" height="25" stroke="#ffaa00" stroke-width="3" fill="none" rx="2"></rect>
                         <rect x="75" y="10" width="15" height="15" fill="#ffaa00" rx="1"></rect>
                         <!-- Outer border alignment square bottom-left -->
                         <rect x="5" y="70" width="25" height="25" stroke="#ffaa00" stroke-width="3" fill="none" rx="2"></rect>
                         <rect x="10" y="75" width="15" height="15" fill="#ffaa00" rx="1"></rect>
                         
                         <!-- Detailed Mock bits (White and orange) -->
                         <rect x="35" y="5" width="5" height="5" fill="#ffffff" rx="1"></rect>
                         <rect x="45" y="5" width="10" height="5" fill="#ffffff" rx="1"></rect>
                         <rect x="60" y="5" width="5" height="5" fill="#ffffff" rx="1"></rect>
                         <rect x="35" y="15" width="15" height="5" fill="#ffaa00" rx="1"></rect>
                         <rect x="55" y="15" width="5" height="5" fill="#ffffff" rx="1"></rect>
                         <rect x="35" y="30" width="5" height="15" fill="#ffffff" rx="1"></rect>
                         <rect x="45" y="35" width="15" height="5" fill="#ffaa00" rx="1"></rect>
                         <rect x="65" y="30" width="10" height="10" fill="#ffffff" rx="1"></rect>
                         <rect x="80" y="35" width="5" height="20" fill="#ffffff" rx="1"></rect>
                         <rect x="10" y="35" width="5" height="10" fill="#ffffff" rx="1"></rect>
                         <rect x="20" y="45" width="10" height="5" fill="#ffffff" rx="1"></rect>
                         <rect x="5" y="55" width="15" height="5" fill="#ffffff" rx="1"></rect>
                         <rect x="35" y="50" width="25" height="5" fill="#ffffff" rx="1"></rect>
                         <rect x="65" y="50" width="5" height="15" fill="#ffaa00" rx="1"></rect>
                         <rect x="45" y="60" width="15" height="10" fill="#ffffff" rx="1"></rect>
                         <rect x="35" y="75" width="5" height="15" fill="#ffffff" rx="1"></rect>
                         <rect x="45" y="80" width="15" height="5" fill="#ffffff" rx="1"></rect>
                         <rect x="65" y="75" width="20" height="5" fill="#ffffff" rx="1"></rect>
                         <rect x="70" y="85" width="15" height="10" fill="#ffaa00" rx="1"></rect>
                         <rect x="90" y="65" width="5" height="15" fill="#ffffff" rx="1"></rect>
                         <rect x="5" y="85" width="25" height="5" fill="#ffffff" rx="1"></rect>
                     </svg>
                </div>
                <div class="cta-subtitle" id="cta-text">ACESSE CROM.ME</div>
            </div>
            
            <div class="social-handles" id="social-handles">

                    <span id="discord-text">discord.gg/crom</span>
                </div>
            </div>
            
            <div class="subtitles-container">
                <div id="subtitles" class="subtitles-text"></div>
            </div>
        </div>
    </div>

    <script>
        let mediaElement = null;
        let isVideo = false;
        let fadeOutDuration = 3.0;

        window.setupTemplate = function(cenaJson) {
            const cena = JSON.parse(cenaJson);
            
            // Set subtitles
            document.getElementById('subtitles').innerText = cena.narracao.texto;
            
            // Show QR code card if configured
            const params = cena.template.parametros || {};
            const showQR = params.show_qr_code !== undefined ? params.show_qr_code : false;
            const qrCard = document.getElementById('outro-card');
            
            qrCard.style.display = showQR ? 'flex' : 'none';
            if (showQR) {
                if (params.text0) {
                    document.getElementById('cta-text').innerText = params.text0;
                }
                document.getElementById('cta-title').innerText = params.cta_title || "Acesse o Sistema";
            }

            // Set handles
            document.getElementById('github-text').innerText = params.github_handle || "github/crom-net";
            document.getElementById('discord-text').innerText = params.discord_handle || "discord.gg/crom";

            // Get fade duration
            fadeOutDuration = params.fade_out_duration !== undefined ? params.fade_out_duration : 3.0;

            // Set media
            const container = document.getElementById('container');
            container.innerHTML = '';

            if (cena.ativos && cena.ativos.media0) {
                const media0 = cena.ativos.media0;
                if (media0.tipo === 'video') {
                    mediaElement = document.createElement('video');
                    mediaElement.src = media0.caminho;
                    mediaElement.muted = true;
                    mediaElement.className = 'main-media';
                    container.appendChild(mediaElement);
                    isVideo = true;
                } else {
                    mediaElement = document.createElement('img');
                    mediaElement.src = media0.caminho;
                    mediaElement.className = 'main-media';
                    container.appendChild(mediaElement);
                    isVideo = false;
                }
            }
        };

        window.seekTo = function(timeInSeconds, totalDuration) {
            if (isVideo && mediaElement) {
                mediaElement.currentTime = timeInSeconds;
            }

            const durationSec = totalDuration || 5.0;
            const progress = Math.min(timeInSeconds / durationSec, 1.0);

            // Card scale and opacity reveal in first 35%
            const cardProgress = Math.min(progress / 0.35, 1.0);
            const cardEase = Math.sin(cardProgress * Math.PI / 2);
            const card = document.getElementById('outro-card');
            card.style.opacity = cardProgress;
            card.style.transform = `translate(-50%, -50%) scale(${0.88 + 0.12 * cardEase})`;

            // Social handles slide-up and fade-in from 0.25 to 0.60
            const socialProgress = Math.max(0, Math.min((progress - 0.25) / 0.35, 1.0));
            const socialEase = Math.sin(socialProgress * Math.PI / 2);
            const social = document.getElementById('social-handles');
            social.style.opacity = socialProgress;
            social.style.transform = `translateX(-50%) translateY(${25 * (1.0 - socialEase)}px)`;

            // Calculate fade out to black in the end
            const fadeStart = durationSec - fadeOutDuration;
            if (timeInSeconds >= fadeStart && fadeOutDuration > 0) {
                const fadeProgress = (timeInSeconds - fadeStart) / fadeOutDuration;
                document.body.style.opacity = Math.max(0, 1.0 - fadeProgress);
            } else {
                document.body.style.opacity = 1.0;
            }
        };
    </script>
</body>
</html>
